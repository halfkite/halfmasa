final int mcVersion = project.mcVersion
final boolean unobfuscated = mcVersion >= 26_00_00
final String loaderVersion = mcVersion >= 26_03_00
        ? '0.19.5'
        : (unobfuscated ? '0.18.4' : rootProject.fabric_loader_version)

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
apply plugin: 'maven-publish'

repositories {
    maven { url = 'https://masa.dy.fi/maven/sakura-ryoko' }
    maven { url = 'https://maven.fallenbreath.me/releases' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.shedaniel.me' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }

    def loader = "net.fabricmc:fabric-loader:${loaderVersion}"
    def malilib = project.mcVersion >= 26_03_00 && project.hasProperty('malilib_local_path')
            ? files(project.property('malilib_local_path'))
            : "maven.modrinth:GcWjdA9I:${project.malilib_modrinth_version_id}"
    def xaeroMinimap = "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
    def xaeroWorldMap = "maven.modrinth:xaeros-world-map:${project.xaero_world_map_version}"
    if (unobfuscated) {
        implementation loader
        implementation malilib
        compileOnly "maven.modrinth:modmenu:${project.mod_menu_version}"
        compileOnly xaeroMinimap
        compileOnly xaeroWorldMap
    } else {
        modImplementation loader
        modImplementation malilib
        modCompileOnly "maven.modrinth:modmenu:${project.mod_menu_version}"
        modCompileOnly xaeroMinimap
        modCompileOnly xaeroWorldMap
        if (project.hasProperty('jei_compile_version')) {
            modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_compile_version}"
        }
        if (project.hasProperty('rei_compile_version')) {
            modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_compile_version}"
        }
        def historyCompatRuntime = project.findProperty('history_compat_runtime') == 'true'
        def historyJeiRuntime = historyCompatRuntime || project.findProperty('history_compat_runtime_jei') == 'true'
        def historyReiRuntime = historyCompatRuntime || project.findProperty('history_compat_runtime_rei') == 'true'
        if ((historyJeiRuntime || historyReiRuntime) &&
                project.hasProperty('jei_compile_version') && project.hasProperty('rei_compile_version')) {
            modLocalRuntime "net.fabricmc.fabric-api:fabric-api:0.116.15+1.21.1"
            modLocalRuntime "dev.architectury:architectury-fabric:13.0.11"
            modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
        }
        if (historyJeiRuntime && project.hasProperty('jei_compile_version')) {
            modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_compile_version}"
        }
        if (historyReiRuntime && project.hasProperty('rei_compile_version')) {
            modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_compile_version}"
        }
    }
}

def refillFabricApiVersions = [
        '1.21.1': '0.116.13+1.21.1', '1.21.3': '0.114.1+1.21.3',
        '1.21.4': '0.119.4+1.21.4', '1.21.5': '0.128.2+1.21.5',
        '1.21.8': '0.136.1+1.21.8', '1.21.10': '0.138.4+1.21.10',
        '1.21.11': '0.141.5+1.21.11', '26.1.2': '0.155.2+26.1.2',
        '26.2': '0.158.0+26.2', '26.3': '0.161.0+26.3'
]
dependencies {
    def api = "net.fabricmc.fabric-api:fabric-api:${refillFabricApiVersions[project.name]}"
    if (unobfuscated) compileOnly api
    else modCompileOnly api
}

configurations.configureEach {
    resolutionStrategy.force "net.fabricmc:fabric-loader:${loaderVersion}"
}

def javaVersion = unobfuscated ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21
group = rootProject.group
def publicationVersion = project.findProperty('publication_version')
if (publicationVersion != null && publicationVersion != rootProject.mod_version) {
    throw new GradleException(
            "publication_version=${publicationVersion} must match mod_version=${rootProject.mod_version}"
    )
}
version = publicationVersion ?: "${rootProject.mod_version}+${rootProject.buildTimestamp}"
base.archivesName = "${rootProject.mod_file_name}-${project.artifact_mc_version}"

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

loom {
    mixin {
        useLegacyMixinAp = !unobfuscated
    }
}

processResources {
    def jeiHistoryLayoutMixins = [
            '"JeiItemHistoryMixin"',
            '"JeiItemHistoryBookmarkMixin"'
    ]
    def legacyBookEditMixins = [
            '"BookEditScreenMixin"',
            '"BookEditDisplayCacheMixin"'
    ]
    def legacyReiLayoutMixins = [
            '"ReiItemHistoryMixin"',
            '"ReiItemHistoryFavoritesMixin"'
    ]
    def integratedServerExitMixins = [
            '"IntegratedServerExitMixin"'
    ]
    def properties = [
            mod_version: project.version,
            minecraft_dependency: project.minecraft_dependency,
            malilib_dependency: project.malilib_dependency,
            fabric_loader_dependency: ">=${loaderVersion}",
            compatibility_level: unobfuscated ? 'JAVA_25' : 'JAVA_21'
    ]
    inputs.properties(properties)
    filesMatching('fabric.mod.json') { expand properties }
    filesMatching('halfmasa.mixins.json') {
        filter { line ->
            if (project.mcVersion >= 26_00_00 && line.contains('"AggregationGameRendererAccessor"')) return null
            if (project.mcVersion >= 1_21_04 && line.contains('"BakedSpawnerItemMixin"')) return null
            if (project.mcVersion >= 1_21_10 && line.contains('"LegacyItemAggregationMixin"')) return null
            if (project.mcVersion < 1_21_04 && ['"SpawnerItemModelMixin"', '"SpawnerItemLayerAccessor"', '"SpawnerItemRenderStateAccessor"'].any { line.contains(it) }) return null
            if (project.mcVersion < 1_21_10 && line.contains('"TrialSpawnerRendererAccessor"')) return null
            if (project.mcVersion < 1_21_01 && [
                    '"LitematicaSaveBlockFilterMixin"', '"LitematicaDeleteBlockFilterMixin"',
                    '"LitematicaAreaDeleteBlockFilterMixin"', '"LitematicaFilteredContainerAccessor"',
                    '"LitematicaTaskWorldAccessor"',
                    '"LitematicaPasteDirectBlockFilterMixin"', '"LitematicaPasteCommandBlockFilterMixin"',
                    '"ConfigSearchBarAccessor"', '"MaLiLibConfigListRecreationMixin"'
            ].any { line.contains(it) }) {
                return null
            }
            if (!project.hasProperty('jei_compile_version') &&
                    jeiHistoryLayoutMixins.any { line.contains(it) }) {
                return null
            }
            if (project.mcVersion >= 1_21_08 && legacyBookEditMixins.any { line.contains(it) }) {
                return null
            }
            if (project.mcVersion >= 1_21_05 && line.contains('"ClickAndSendMixin"')) {
                return null
            }
            if (project.mcVersion < 1_21_08 && line.contains('"BookEditMultiLineMixin"')) {
                return null
            }
            if (project.mcVersion >= 26_01_00 && legacyReiLayoutMixins.any { line.contains(it) }) {
                return null
            }
            if (project.mcVersion < 26_02_00 && integratedServerExitMixins.any { line.contains(it) }) {
                return null
            }
            if (project.mcVersion < 26_01_00 && line.contains('"ImePreeditOverlayMixin"')) {
                return null
            }
            if ((project.mcVersion < 26_01_00 || project.mcVersion >= 26_02_00) &&
                    line.contains('"ScreenshotKeyboardHandlerMixin"')) {
                return null
            }
            line.replace('{{COMPATIBILITY_LEVEL}}', properties.compatibility_level)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = unobfuscated ? 25 : 21

    def explicitBuildProjects = gradle.startParameter.taskNames
            .findAll { it ==~ /:[^:]+:build/ }
            .collect { it.substring(0, it.lastIndexOf(':')) }
            .unique()
    if (explicitBuildProjects.size() == 1 && !explicitBuildProjects.contains(project.path)) {
        onlyIf { false }
    }
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    withSourcesJar()
}

sourceSets {
    main {
        java {
            if (project.mcVersion >= 26_00_00) {
                exclude 'io/github/halfmasa/xaerobinding/mixin/AggregationGameRendererAccessor.java'
            }
            if (project.mcVersion >= 1_21_04) {
                exclude 'io/github/halfmasa/xaerobinding/feature/BakedSpawnerPreview.java'
                exclude 'io/github/halfmasa/xaerobinding/mixin/BakedSpawnerItemMixin.java'
            }
            if (project.mcVersion >= 1_21_05) {
                exclude 'io/github/halfmasa/xaerobinding/feature/SpawnerPreviewBakedModel.java'
            }
            if (project.mcVersion >= 1_21_10) {
                exclude 'io/github/halfmasa/xaerobinding/feature/LegacySpawnerItemModel.java'
                exclude 'io/github/halfmasa/xaerobinding/mixin/LegacyItemAggregationMixin.java'
            }
            if (project.mcVersion >= 26_02_00) {
                exclude 'io/github/halfmasa/xaerobinding/mixin/BookEditScreenMixin.java'
                exclude 'io/github/halfmasa/xaerobinding/mixin/BookEditDisplayCacheMixin.java'
                exclude 'io/github/halfmasa/xaerobinding/mixin/ClickAndSendMixin.java'
                exclude 'io/github/halfmasa/xaerobinding/mixin/JeiItemHistoryMixin.java'
                exclude 'io/github/halfmasa/xaerobinding/mixin/JeiItemHistoryBookmarkMixin.java'
                exclude 'io/github/halfmasa/xaerobinding/mixin/ReiItemHistoryMixin.java'
                exclude 'io/github/halfmasa/xaerobinding/mixin/ReiItemHistoryFavoritesMixin.java'
            }
        }
    }
}

// Preprocess expects every node in the graph to have matching source set names.
// Older nodes have no companion sources or distributable tasks.
sourceSets.maybeCreate('voidTradingServer')

if (project.mcVersion >= 26_03_00) {
    def voidTradingServer = sourceSets.getByName('voidTradingServer')
    sourceSets.named('voidTradingServer') {
        java.srcDirs = [
                rootProject.file('src/server/void-trading/java'),
                rootProject.file('src/shared/void-trading/java')
        ]
        resources.srcDir rootProject.file('src/server/void-trading/resources')
    }

    configurations[voidTradingServer.implementationConfigurationName]
            .extendsFrom(configurations.implementation)
    configurations[voidTradingServer.compileOnlyConfigurationName]
            .extendsFrom(configurations.compileOnly)
    voidTradingServer.compileClasspath += sourceSets.main.compileClasspath

    tasks.named(voidTradingServer.processResourcesTaskName) {
        filesMatching('fabric.mod.json') {
            expand(mod_version: project.version)
        }
    }

    tasks.register('voidTradingServerJar', Jar) {
        dependsOn tasks.named(voidTradingServer.classesTaskName)
        from voidTradingServer.output
        archiveBaseName = "halfmasa-void-trading-server-${project.artifact_mc_version}"
        archiveClassifier = ''
        from(rootProject.file('LICENSE')) {
            rename { 'LICENSE_halfmasa-void-trading-server' }
        }
    }

    tasks.named('build') {
        dependsOn tasks.named('voidTradingServerJar')
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
